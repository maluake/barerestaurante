services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://gastro:gastro@db:5432/gastro
      DEBUG: "False"
      SECRET_KEY: somente-para-demonstracao-no-codespaces
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: https://*.app.github.dev,http://localhost:8000,http://127.0.0.1:8000
      SECURE_COOKIES: "False"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gastro
      POSTGRES_USER: gastro
      POSTGRES_PASSWORD: gastro
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
